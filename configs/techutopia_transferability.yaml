experiment_name: frozen-noise-techutopia-confirmation
task_type: caption
caption_prompt: Provide a concise description of the image using no more than three sentences.
require_source_absent: true
models:
  - provider: openai
    model_id: gpt-4o
    base_url: https://copilot.techutopia.cn/v1
    api_key_env: TECHUTOPIA_API_KEY
    max_output_tokens: 64
    max_retries: 3
    requests_per_minute: 30
  - provider: openai
    model_id: gpt-5-mini
    base_url: https://copilot.techutopia.cn/v1
    api_key_env: TECHUTOPIA_API_KEY
    max_output_tokens: 64
    max_retries: 3
    requests_per_minute: 30
