experiment_name: transferability-primary-screening
task_type: caption
caption_prompt: Provide a concise description of the image using no more than three sentences.
models:
  - provider: openai
    model_id: gpt-5.6-luna
    api_key_env: OPENAI_API_KEY
    max_output_tokens: 64
  - provider: gemini
    model_id: gemini-3.5-flash
    api_key_env: GEMINI_API_KEY
    max_output_tokens: 64
  - provider: anthropic
    model_id: claude-sonnet-5
    api_key_env: ANTHROPIC_API_KEY
    max_output_tokens: 64
